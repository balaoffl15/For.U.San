<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For San</title>
    <!-- Google Fonts for High-End Editorial Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #FFFFFF;
            --bg-paper: #FCFAF7;
            --accent-purple: #6F4A9E;
            --accent-muted: #A88BC7;
            --accent-light: #EDE6F5;
            --text-dark: #17151A;
            --text-muted: #6F6A73;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-script: 'Alex Brush', cursive;
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-dark);
            font-family: var(--font-sans);
            font-weight: 300;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Atmospheric Canvas Canvas Overlay */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.65;
        }

        /* Minimal Fixed Corner Audio Control */
        .audio-control {
            position: fixed;
            top: 2.2rem;
            right: 2.2rem;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        .audio-control.visible {
            opacity: 0.55;
            visibility: visible;
        }

        .audio-control.visible:hover {
            opacity: 0.95;
        }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--accent-purple);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s var(--ease-cinematic);
        }

        .audio-btn:hover {
            transform: scale(1.08);
        }

        .audio-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Fullscreen Editorial Page System */
        .viewport {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            z-index: 2;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 1.5rem;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 1.4s var(--ease-cinematic), visibility 1.4s;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Cinematic Choreographed Reveals */
        .reveal-item {
            opacity: 0;
            transform: translateY(22px);
            filter: blur(8px);
            letter-spacing: normal;
            transition: opacity 1.6s var(--ease-cinematic), 
                        transform 1.6s var(--ease-cinematic), 
                        filter 1.6s var(--ease-cinematic),
                        letter-spacing 1.8s var(--ease-cinematic);
            will-change: opacity, transform, filter;
        }

        .reveal-item.revealed {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* Directional Variant for Specific Reveals */
        .reveal-item.from-left {
            transform: translateX(-20px);
        }
        .reveal-item.from-right {
            transform: translateX(20px);
        }
        .reveal-item.from-left.revealed,
        .reveal-item.from-right.revealed {
            transform: translateX(0);
        }

        /* Typography */
        .script-text {
            font-family: var(--font-script);
            color: var(--accent-purple);
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 400;
            line-height: 1.2;
        }

        .serif-heading {
            font-family: var(--font-serif);
            font-weight: 300;
            color: var(--text-dark);
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            line-height: 1.28;
            letter-spacing: -0.01em;
            text-align: center;
        }

        .uppercase-label {
            font-size: 0.7rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--accent-purple);
            margin-bottom: 1.6rem;
            font-weight: 500;
        }

        .body-editorial {
            font-size: clamp(1rem, 2vw, 1.2rem);
            color: var(--text-muted);
            line-height: 1.85;
            max-width: 600px;
            text-align: center;
        }

        .highlight-purple {
            color: var(--accent-purple);
            font-weight: 400;
        }

        /* Invitation Button Link */
        .btn-continue {
            margin-top: 3.8rem;
            background: none;
            border: none;
            font-family: var(--font-serif);
            font-size: 1.15rem;
            color: var(--text-dark);
            cursor: pointer;
            padding: 0.6rem 0.2rem;
            position: relative;
            text-decoration: none;
            transition: color 0.5s ease, transform 0.5s ease;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-continue::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: var(--accent-purple);
            transform: scaleX(0.25);
            transform-origin: center;
            transition: transform 0.6s var(--ease-cinematic), opacity 0.6s;
            opacity: 0.5;
        }

        .btn-continue:hover {
            transform: translateY(-2px);
            color: var(--accent-purple);
        }

        .btn-continue:hover::after {
            transform: scaleX(1);
            opacity: 1;
        }

        /* Story Page Layout (Page 4) */
        .story-container {
            max-width: 580px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
            text-align: center;
        }

        .story-chapter {
            position: relative;
        }

        .story-chapter:not(:last-child)::after {
            content: '';
            display: block;
            width: 25px;
            height: 1px;
            background-color: var(--accent-light);
            margin: 2.2rem auto 0 auto;
        }

        .chapter-label {
            font-size: 0.65rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent-muted);
            margin-bottom: 0.4rem;
        }

        .chapter-text {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            color: var(--text-dark);
            line-height: 1.55;
        }

        /* Memories Offset Layout (Page 5) */
        .memories-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 540px;
            text-align: center;
        }

        .memory-line {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            color: var(--text-dark);
            font-weight: 300;
        }

        .memory-line:nth-child(even) { transform: translateX(12px); }
        .memory-line:nth-child(3n) { transform: translateX(-10px); }

        /* Minimal Vinyl Record (Page 6) */
        .vinyl-wrapper {
            margin: 2.5rem 0 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .vinyl-record {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            background: radial-gradient(circle, #2a282e 0%, #17151a 70%, #0d0c0e 100%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.12), inset 0 0 0 2px rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 14s linear infinite;
            animation-play-state: paused;
            transition: box-shadow 0.8s ease;
        }

        .vinyl-record.playing {
            animation-play-state: running;
            box-shadow: 0 12px 35px rgba(111, 74, 158, 0.22), inset 0 0 0 2px rgba(255,255,255,0.08);
        }

        .vinyl-grooves {
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow: inset 0 0 0 10px rgba(255,255,255,0.02), inset 0 0 0 20px rgba(0,0,0,0.2);
        }

        .vinyl-center {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent-purple);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 2px 8px rgba(111, 74, 158, 0.4);
        }

        .vinyl-center::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: var(--bg-primary);
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Wishes List Layout (Page 7) */
        .wishes-container {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            text-align: center;
            max-width: 500px;
            margin: 1.5rem 0;
        }

        .wish-item {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            color: var(--text-muted);
        }

        /* Envelope Interactive Centerpiece (Page 9) */
        .envelope-scene {
            position: relative;
            width: 310px;
            height: 210px;
            margin: 2.5rem 0;
            cursor: pointer;
            perspective: 1000px;
        }

        .envelope-base {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #FAF9FC;
            border: 1px solid #ECE7F2;
            box-shadow: 0 15px 35px rgba(23, 21, 26, 0.05);
            border-radius: 4px;
            overflow: hidden;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 155px solid #F4F1F7;
            border-right: 155px solid #F4F1F7;
            border-bottom: 105px solid #ECE7F2;
            border-top: 105px solid transparent;
            z-index: 3;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 155px solid transparent;
            border-right: 155px solid transparent;
            border-top: 115px solid #E5DFEC;
            transform-origin: top center;
            transition: transform 1.2s var(--ease-cinematic);
            z-index: 4;
        }

        .envelope-seal {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background-color: var(--accent-purple);
            border-radius: 50%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(111, 74, 158, 0.3);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .envelope-letter-preview {
            position: absolute;
            bottom: 10px;
            left: 20px;
            right: 20px;
            height: 170px;
            background: #FFFFFF;
            border: 1px solid #EAE6EF;
            box-shadow: 0 0 10px rgba(0,0,0,0.02);
            z-index: 2;
            transition: transform 1.5s var(--ease-cinematic);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Envelope Open Animation Sequence */
        .envelope-scene.opening .envelope-seal {
            opacity: 0;
            transform: translateX(-50%) scale(0.6);
        }

        .envelope-scene.opening .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-scene.opening .envelope-letter-preview {
            transform: translateY(-130px);
            z-index: 3;
        }

        /* Multi-Page Physical Letter Container (Page 10 Series) */
        .letter-paper {
            background: var(--bg-paper);
            max-width: 680px;
            width: 100%;
            padding: 3rem 2rem;
            margin: 0 auto;
            border: 1px solid #F0ECE4;
            box-shadow: 0 10px 40px rgba(23, 21, 26, 0.03);
            border-radius: 2px;
        }

        .letter-heading {
            font-family: var(--font-serif);
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 400;
            color: var(--text-dark);
            margin-bottom: 2.2rem;
            text-align: center;
        }

        .letter-body {
            font-family: var(--font-serif);
            font-size: clamp(1.15rem, 2.2vw, 1.3rem);
            line-height: 1.95;
            color: #2D2A32;
            font-weight: 300;
        }

        .letter-body p {
            margin-bottom: 1.6rem;
            text-align: justify;
            text-justify: inter-word;
        }

        .letter-body p.thanks-list {
            text-align: left;
            margin-bottom: 0.4rem;
        }

        .letter-page-indicator {
            font-size: 0.68rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-muted);
            margin-bottom: 1.5rem;
        }

        /* Final Page Composition (Page 11) */
        .final-composition {
            max-width: 620px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quote-serif {
            font-family: var(--font-serif);
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            line-height: 1.65;
            color: var(--text-dark);
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .signature-block {
            margin-top: 3.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sign-off {
            font-family: var(--font-script);
            font-size: 2.4rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .author-name {
            font-family: var(--font-serif);
            font-size: 1.7rem;
            letter-spacing: 0.08em;
            color: var(--text-dark);
            margin-bottom: 0.8rem;
        }

        .signature-line {
            width: 45px;
            height: 1px;
            background-color: var(--accent-purple);
            opacity: 0.7;
        }

        /* Accessibility & Motion Preference */
        @media (prefers-reduced-motion: reduce) {
            .reveal-item {
                transform: none !important;
                filter: none !important;
                transition: opacity 0.6s ease !important;
            }
            .envelope-flap, .envelope-letter-preview, .vinyl-record {
                transition: none !important;
                animation: none !important;
            }
        }

        /* Responsive Formatting */
        @media (max-width: 600px) {
            .page { padding: 2.5rem 1.25rem; }
            .envelope-scene { transform: scale(0.88); }
            .letter-paper { padding: 2rem 1.25rem; }
            .memory-line:nth-child(even), .memory-line:nth-child(3n) { transform: none; }
            .letter-body p { text-align: left; }
        }
    </style>
</head>
<body>

    <!-- Atmospheric Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Ambient Corner Audio Button -->
    <div class="audio-control" id="audioControl">
        <button class="audio-btn" id="audioToggleBtn" aria-label="Toggle Audio">
            <svg viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </button>
    </div>

    <!-- Hidden Audio Tag -->
    <audio id="bgAudio" loop preload="auto">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <main class="viewport">

        <!-- PAGE 1: OPENING INVITATION -->
        <section class="page active" id="page-1">
            <div class="reveal-item script-text" style="margin-bottom: 1rem;">For someone special...</div>
            <h1 class="reveal-item serif-heading" style="font-size: clamp(3rem, 7vw, 4.5rem);">Hey San</h1>
            <div class="reveal-item" style="margin: 1.2rem 0; color: var(--accent-purple); font-size: 0.9rem;">❤️</div>
            <p class="reveal-item body-editorial" style="font-size: 1.1rem;">I made something for you.</p>
            <button class="btn-continue reveal-item" onclick="nextPage(2)">Continue →</button>
        </section>

        <!-- PAGE 2: BIRTHDAY REVEAL -->
        <section class="page" id="page-2">
            <div class="reveal-item uppercase-label">FOR SAN</div>
            <h2 class="reveal-item serif-heading">Happiest Birthday, San</h2>
            <div class="reveal-item" style="margin: 1rem 0; font-size: 1.2rem;">🌻</div>
            <p class="reveal-item body-editorial" style="margin-bottom: 1rem;">Today is a little more special because it belongs to you.</p>
            <div class="reveal-item script-text" style="font-size: 1.8rem;">And I wanted to make something just for you.</div>
            <button class="btn-continue reveal-item" onclick="nextPage(3)">Continue →</button>
        </section>

        <!-- PAGE 3: A FEW THINGS ABOUT YOU -->
        <section class="page" id="page-3">
            <div class="reveal-item uppercase-label">A FEW THINGS ABOUT YOU</div>
            <div style="display: flex; flex-direction: column; gap: 1.8rem; align-items: center; margin: 1rem 0;">
                <div class="reveal-item serif-heading" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem);">You listen.</div>
                <div class="reveal-item serif-heading" style="font-size: clamp(1.8rem, 3.5vw, 2.5rem);">You care.</div>
